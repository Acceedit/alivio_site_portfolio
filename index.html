<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Alivio</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__top">
          <img src="img/logo.svg" alt="logo" class="logo" />
          <ul class="menu">
            <li class="menu__item"><a href="">Why Alivio</a></li>
            <li class="menu__item"><a href="">Solutions</a></li>
            <li class="menu__item"><a href="">Community</a></li>
            <li class="menu__item"><a href="">Pricing</a></li>
          </ul>
          <div class="header__actions">
            <a class="header__sing-in">Sign in</a>
            <button class="header__button">Start Trial</button>
          </div>
        </div>
      </div>
    </header>
    <div class="header__main">
      <div class="container">
        <h1 class="header__main-title">Be aware, Manage well.</h1>
        <p class="header__main-description">
          Everyone experiences stress in different ways. Let Alivio guide you,
          in a personalized journal experience, to overcome your stress.
        </p>
        <button class="header__button header__main-button">
          Find Your Way
        </button>
      </div>
    </div>
  </body>
</html>
